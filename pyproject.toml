[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-agent-plateform"
version = "1.0.0"
description = "Enterprise AI agent platform reference implementation: LangGraph orchestration, tool calling with authorization, RAG, memory, human-in-the-loop approvals, guardrails, structured outputs and tracing"
authors = [{ name = "Shiv Kumar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
agent-platform = "agent_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["data/*.sql", "data/knowledge/*.md", "data/knowledge/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
ignore_missing_imports = true
disallow_subclassing_any = false
